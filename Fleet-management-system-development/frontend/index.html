<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        try {
          const currentLang = localStorage.getItem("app_language_code") || "en";
          const hostname = window.location.hostname;
          const paths = ["/", "/admin", "/manager", "/driver"];
          const domains = ["", hostname, `.${hostname}`];

          if (currentLang === "en") {
            paths.forEach(function(p) {
              domains.forEach(function(d) {
                var domPart = d ? "; domain=" + d : "";
                document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=" + p + domPart;
              });
            });
          } else {
            document.cookie = "googtrans=/en/" + currentLang + "; path=/;";
            if (hostname && hostname !== "localhost") {
              document.cookie = "googtrans=/en/" + currentLang + "; path=/; domain=." + hostname + ";";
            }
          }
          if (window.google && window.google.translate) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch (e) {
          console.warn("Translate init warning:", e);
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
