# Fleet Management System - Nginx Frontend + Reverse Proxy CSP Configuration
# Apply at the reverse proxy / static HTML serving layer.

server {
    listen 443 ssl http2;
    server_name fleet.speshway.site;

    root /var/www/fleet-management/frontend/dist;
    index index.html;

    # Security headers for SPA HTML & static frontend assets
    set $fleet_csp "default-src 'self'; script-src 'self' https://translate.google.com https://translate.googleapis.com https://translate-pa.googleapis.com https://www.google.com https://www.gstatic.com 'sha256-R6kjt5FwTd5vAw94Q08NLDZsSaGTzg4NsdIfKtECSp0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com https://translate.googleapis.com; img-src 'self' data: blob: https://fleet.speshway.site https://res.cloudinary.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://api.mapbox.com https://cdnjs.cloudflare.com https://images.unsplash.com https://imagedelivery.net https://www.gstatic.com https://www.google.com https://translate.google.com https://translate.googleapis.com https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fleet.speshway.site wss://fleet.speshway.site https://api.cloudinary.com https://res.cloudinary.com https://fcm.googleapis.com https://firebaseinstallations.googleapis.com https://firebase.googleapis.com https://api.iconify.design https://api.unisvg.com https://api.simplesvg.com https://api.mapbox.com https://events.mapbox.com https://router.project-osrm.org https://nominatim.openstreetmap.org https://photon.komoot.io https://translate.googleapis.com https://translate-pa.googleapis.com https://translate.google.com https://www.google.com; frame-src 'self' data: blob: https://fleet.speshway.site https://res.cloudinary.com https://www.google.com https://recaptcha.google.com https://www.gstatic.com https://translate.google.com; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /api/security/csp-report";

    add_header Content-Security-Policy $fleet_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Express API & Socket.IO reverse proxy (backend Helmet preserves API headers)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

